<script>
const periods=["chores","annual","quarterly","monthly","weekly","daily","tuesday","wednesday","thursday","friday","saturday","sunday"];

const status=document.querySelector('#status'),workspace=document.querySelector('#workspace');
      const escapeHTML = (s) =>
        s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      function inline(text) {
        const tokens = [];
        const hold = (html) => "\u0000" + (tokens.push(html) - 1) + "\u0000";
        let value = escapeHTML(text).replace(/`([^`]+)`/g, (_, code) =>
          hold("<code>" + code + "</code>"),
        );
        value = value.replace(
          /\[([^\]\n]+)\]\(([^\s)]+)\)/g,
          (_, label, url) => {
            if (!/^(https?:\/\/|mailto:)/i.test(url)) return label;
            return hold(
              '<a href="' +
                url +
                '" target="_blank" rel="noopener noreferrer">' +
                label +
                "</a>",
            );
          },
        );
        value = value
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/__(.+?)__/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>")
          .replace(/(^|\s)_([^_]+)_(?=\s|$)/g, "$1<em>$2</em>")
          .replace(/~~(.+?)~~/g, "<del>$1</del>");
        return value.replace(/\u0000(\d+)\u0000/g, (_, n) => tokens[Number(n)]);
      }
      function renderMarkdown(source) {
        const lines = source.replace(/\r/g, "").split("\n");
        let html = "",
          lists = [],
          code = null,
          paragraph = [];
        const flushParagraph = () => {
          if (paragraph.length) {
            html += "<p>" + paragraph.map(inline).join("<br>") + "</p>";
            paragraph = [];
          }
        };
        const closeListLevel = () => {
          const list = lists.pop();
          html += "</li></" + list.kind + ">";
        };
        const closeList = () => {
          while (lists.length) closeListLevel();
        };
        lines.forEach((line, index) => {
          if (code !== null) {
            if (/^\s*```/.test(line)) {
              html +=
                "<pre><code>" + escapeHTML(code.join("\n")) + "</code></pre>";
              code = null;
            } else code.push(line);
            return;
          }
          if (/^\s*```/.test(line)) {
            flushParagraph();
            closeList();
            code = [];
            return;
          }
          if (!line.trim()) {
            flushParagraph();
            const next = lines.slice(index + 1).find(line => line.trim());
            if (!next || !/^\s*(?:[-*+]\s+|\d+[.)]\s+)/.test(next)) closeList();
            return;
          }
          const heading = line.match(/^(#{1,6})\s+(.+)$/),
            item = line.match(/^(\s*)(?:[-*+]\s+|(\d+)[.)]\s+)(.*)$/);

            flushParagraph();
            closeList();
            const n = heading[1].length;
            html += "<h" + n + ">" + inline(heading[2]) + "</h" + n + ">";
            return;
          }
          if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) {
            flushParagraph();
            closeList();
            html += "<hr>";
            return;
          }
          if (/^>\s?/.test(line)) {
            flushParagraph();
            closeList();
            html +=
              "<blockquote>" +
              inline(line.replace(/^>\s?/, "")) +
              "</blockquote>";
            return;
          }
          if (item) {
            flushParagraph();
            const indent = item[1].replace(/\t/g, "    ").length;
            const kind = item[2] ? "ol" : "ul";
            while (lists.length && lists[lists.length - 1].indent > indent) {
              closeListLevel();
            }
            let current = lists[lists.length - 1];
            if (current && current.indent === indent && current.kind !== kind) {
              closeListLevel();
              current = lists[lists.length - 1];
            }
            if (!current || indent > current.indent) {
              html += "<" + kind + (kind === "ol" && Number(item[2]) !== 1
                ? ' start="' + Number(item[2]) + '"' : "") + ">";
              lists.push({ kind, indent });

            }
            const task = item[3].match(/^\[([ xX])\]\s+(.*)$/);

                index +
                '" aria-label="' +
                escapeHTML(task[2]) +
                '" ' +
                (task[1] !== " " ? "checked" : "") +
                "><span>" +
                inline(task[2]) +
                "</span>"
              : "<li>" + inline(item[3]);
            return;
          }
          if (lists.length && /^\s+/.test(line) &&
              line.match(/^\s*/)[0].replace(/\t/g, "    ").length > lists[lists.length - 1].indent) {
            html += "<br>" + inline(line.trim());
            return;
          }
          closeList();
          paragraph.push(line);
        });
        flushParagraph();
        closeList();
        if (code !== null)
          html += "<pre><code>" + escapeHTML(code.join("\n")) + "</code></pre>";
        return html;
      }

function render(){let count=0;for(const key of periods){const text=editors[key].value;previews[key].innerHTML=text.trim()?renderMarkdown(text):'<p class="empty">No notes yet.</p>';count+=text.trim()?text.trim().split(/\s+/).length:0;}document.querySelector('#words').textContent=count+' '+(count===1?'word':'words');}
let savedSnapshot=JSON.stringify(noteSnapshot());
let savedLabel='No file loaded';

function markdownBackup(){
  const notes=noteSnapshot();
  const body=periods.map(key=>'# '+(key==='daily'?'Monday':key[0].toUpperCase()+key.slice(1))+'\n\n'+notes[key]).join('\n\n');

function parseMarkdownBackup(source){
  const text=source.replace(/\r\n/g,'\n');
  const marker=text.match(/<!-- todo-manager-backup-v1:(.*?) -->\s*$/);
    let notes;
    if(marker){
      notes=JSON.parse(decodeURIComponent(marker[1]));
      if(!notes||typeof notes!=='object'||periods.some(key=>typeof notes[key]!=='string'))throw new Error('This backup is missing panel data.');
    }else{
      // Support the older export format in its original panel order.
      notes={};let offset=0;
      for(let i=0;i<periods.length;i++){
        const label=key=>key==='daily'?'Monday':key[0].toUpperCase()+key.slice(1);
        const heading='# '+label(periods[i])+'\n\n';
        if(!text.startsWith(heading,offset))throw new Error('Use a Markdown file exported by this app.');
        const start=offset+heading.length;
        const next=i+1<periods.length?text.indexOf('\n\n# '+label(periods[i+1])+'\n\n',start):-1;
        if(i+1<periods.length&&next<0)throw new Error('This export is missing a panel.');
        notes[periods[i]]=text.slice(start,next<0?text.length:next);
        offset=next+2;
      }
    }

}
function loadNotes(notes,label){

  tokenMessage.textContent='Signing in…';
  try{
    const response=await fetch('/api/session',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    if(!response.ok)throw new Error(await response.text());
    tokenDialog.close();tokenMessage.textContent=loginExplanation;logoutButton.hidden=false;
    loginPending=false;
    if(action==='load')await loadInitialNotes();
    else await saveR2();
  }catch(error){tokenMessage.textContent=error.message||'Could not sign in. Please try again.';}
  finally{loginPending=false;document.querySelector('#token-submit').disabled=false;}
});
async function saveR2(){
  if(!r2Connection||r2Pending||initialLoading||loginPending||loggingOut)return;
  const connection=r2Connection,snapshot=JSON.stringify(noteSnapshot()),content=markdownBackup();
  r2Pending=true;r2SaveButton.disabled=true;status.textContent='Saving to R2…';
  try{
    const response=await fetch(connection.endpoint,{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'text/markdown; charset=utf-8','If-Match':connection.etag},body:content});
    if(!response.ok){
      const message=await response.text();
      if(response.status===401){tokenMessage.textContent='Your sign-in expired. Enter NOTES_TOKEN to save your edits.';askForToken('save');}
      throw new Error(message);
    }
    const etag=response.headers.get('ETag');
    if(!etag)throw new Error('Save could not be confirmed. Reload R2 before saving again.');
    connection.etag=etag;savedSnapshot=snapshot;savedLabel='Saved to R2';
    initialNotice.hidden=true;logoutButton.hidden=false;
  }catch(error){initialMessage.textContent=error.message||'Could not save to R2.';initialNotice.hidden=false;}
  finally{r2Pending=false;r2SaveButton.disabled=false;updateSaveStatus();}
}
r2SaveButton.addEventListener('click',saveR2);
async function loadInitialNotes(){
  if(initialLoading||r2Pending||loginPending||loggingOut)return;
  initialLoading=true;
  const before=JSON.stringify(noteSnapshot());
  for(const editor of Object.values(editors))editor.disabled=true;
  document.querySelector('#r2-open').disabled=true;
  document.querySelector('#initial-load-retry').disabled=true;
  initialNotice.hidden=true;status.textContent='Loading notes…';
  try{
    if(location.protocol==='file:')throw new Error('Run npm run dev or open the deployed app to load your notes.');
    const response=await fetch('/api/notes?source=public',{cache:'no-store',credentials:'same-origin'});
    if(!response.ok){
      const message=await response.text();
      if(response.status===401){
        tokenMessage.textContent=loginExplanation;askForToken('load');
        savedLabel='Sign in to load notes';updateSaveStatus();return;
      }
      throw new Error(message);
    }
    logoutButton.hidden=false;
    const etag=response.headers.get('ETag');
    if(!etag)throw new Error('The Markdown source must return an ETag header to enable saving.');
    const notes=parseMarkdownBackup(await response.text());
    if(before!==JSON.stringify(noteSnapshot()))throw new Error('Your edits were kept. Export them before retrying the initial load.');
    if(loadNotes(notes,'Loaded from R2 Markdown URL')){
      r2Connection={endpoint:'/api/notes',etag};r2SaveButton.hidden=false;
    }else updateSaveStatus();
  }catch(error){
    initialNotice.hidden=false;initialMessage.textContent='Could not load initial notes. '+(error.message||'Please try again.');
    savedLabel='Initial load failed';updateSaveStatus();
  }finally{
    initialLoading=false;
    for(const editor of Object.values(editors))editor.disabled=!r2Connection;
    document.querySelector('#r2-open').disabled=false;
    document.querySelector('#initial-load-retry').disabled=false;
  }
}
document.querySelector('#initial-load-retry').addEventListener('click',loadInitialNotes);
document.querySelector('#r2-open').addEventListener('click',loadInitialNotes);
logoutButton.addEventListener('click',async()=>{
  if(loggingOut||r2Pending||initialLoading||loginPending)return;
  if(hasUnsavedChanges()&&!confirm('Discard unsaved edits and log out? Export first if you want to keep them.'))return;
  loggingOut=true;logoutButton.disabled=true;
  for(const editor of Object.values(editors))editor.disabled=true;
  try{
    const response=await fetch('/api/session',{method:'DELETE',credentials:'same-origin'});
    if(!response.ok)throw new Error(await response.text());
    for(const editor of Object.values(editors))editor.value='';
    r2Connection=null;r2SaveButton.hidden=true;logoutButton.hidden=true;
    savedSnapshot=JSON.stringify(noteSnapshot());savedLabel='Signed out';
    initialNotice.hidden=true;tokenInput.value='';tokenMessage.textContent=loginExplanation;
    render();updateSaveStatus();askForToken('load');
  }catch(error){initialMessage.textContent=error.message||'Could not log out. Please try again.';initialNotice.hidden=false;}
  finally{loggingOut=false;logoutButton.disabled=false;for(const editor of Object.values(editors))editor.disabled=!r2Connection;}
});

// Duplicate the current line, or selected complete lines, in the editor that has focus.
for(const editor of Object.values(editors))editor.addEventListener('keydown',event=>{
  if(!event.altKey||event.metaKey||event.ctrlKey||event.isComposing||editor.disabled||editor.readOnly)return;
  if(event.key!=='ArrowUp'&&event.key!=='ArrowDown')return;
  event.preventDefault();
  const text=editor.value,start=editor.selectionStart,end=editor.selectionEnd;
  const lineStart=start===0?0:text.lastIndexOf('\n',start-1)+1;
  // A selection ending at the start of the next line excludes that next line.
  const lastSelected=end>start?end-1:end;
  const nextBreak=text.indexOf('\n',lastSelected);
  const lineEnd=nextBreak===-1?text.length:nextBreak;
  const block=text.slice(lineStart,lineEnd);
  const above=event.key==='ArrowUp';
  const position=above?lineStart:lineEnd;
  const insertion=above?block+'\n':'\n'+block;
  const shift=above?0:insertion.length;
  const scrollTop=editor.scrollTop,scrollLeft=editor.scrollLeft;
  const direction=editor.selectionDirection;
  editor.setRangeText(insertion,position,position,'preserve');
  editor.setSelectionRange(start+shift,end+shift,direction);
  editor.scrollTop=scrollTop;editor.scrollLeft=scrollLeft;
  change();
});

document.addEventListener('keydown',event=>{
  const optionSave=event.altKey&&!event.metaKey&&!event.ctrlKey&&(event.code==='KeyS'||event.key.toLowerCase()==='s');
  const commandSave=(event.metaKey||event.ctrlKey)&&!event.altKey&&event.key.toLowerCase()==='s';
  if(!optionSave&&!commandSave)return;
  event.preventDefault();
  if(event.repeat||r2Pending||initialLoading||loginPending||loggingOut)return;
  if(r2Connection){saveR2();return;}
  loadInitialNotes();
});
window.addEventListener('beforeunload',event=>{
  if(!hasUnsavedChanges())return;
  event.preventDefault();
  event.returnValue='';
});
render();updateSaveStatus();
const initialLoadPromise=loadInitialNotes();
</script></body></html>
